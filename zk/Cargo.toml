[workspace]
members = ["methods", "core"]

[package]
name = "spike1"
version = "0.1.0"
edition = "2021"

[dependencies]
spike-methods = { path = "methods" }
spike-core = { path = "core" }
risc0-zkvm = { version = "3.0.5", features = ["prove"] }
ed25519-dalek = "2.2.0"
blake2 = "0.10.6"
sha2 = "0.10.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
